# ============================================================
# Mango Keybindings — extras/overrides for the DMS keymap
# ============================================================
# This file ONLY contains binds that do NOT exist in ./dms/binds.conf
# (which is the canonical SUPER-centric set produced by `dms setup`).
# Every combo below is unique across both files — nothing is double-bound.
#
# Cluster legend:
#   SUPER           = launchers, focus, window state        (dms/binds.conf)
#   SUPER+SHIFT     = move window / attendant actions       (dms + here)
#   SUPER+CTRL      = layout, tags, floating move, checks
#   SUPER+ALT       = resize
#   SUPER+CTRL+ALT  = scroller stack
#   SUPER+SHIFT+CTRL= monitor ops
#   SUPER+ALT+SHIFT = focus monitor
#   ALT / CTRL      = launcher alternates, adjacent tags
#   SUPER+SHIFT+S   = screenshots (dms; no Print key on this keyboard): S/+CTRL/+ALT/+CTRL+ALT
#   XF86            = hardware keys
# Lowercase letters are plain keys; never bind UPPERCASE letters (Shift keysyms).
# ============================================================

# --- Browser ---
bind=SUPER+SHIFT,Return,spawn,firefox

# --- Window State ---
bind=SUPER+SHIFT,o,toggleoverlay

# --- Resize Window (SUPER+ALT + arrows) ---
bind=SUPER+ALT,Left,resizewin,-50,+0
bind=SUPER+ALT,Right,resizewin,+50,+0
bind=SUPER+ALT,Up,resizewin,+0,-50
bind=SUPER+ALT,Down,resizewin,+0,+50

# --- Move Floating Window (SUPER+CTRL + arrows) ---
bind=SUPER+CTRL,Left,movewin,-50,+0
bind=SUPER+CTRL,Right,movewin,+50,+0
bind=SUPER+CTRL,Up,movewin,+0,-50
bind=SUPER+CTRL,Down,movewin,+0,+50

# --- Scroller Stack (SUPER+CTRL+ALT + arrows) ---
bind=SUPER+CTRL+ALT,Left,scroller_stack,left
bind=SUPER+CTRL+ALT,Right,scroller_stack,right
bind=SUPER+CTRL+ALT,Up,scroller_stack,up
bind=SUPER+CTRL+ALT,Down,scroller_stack,down

# --- Dwindle Layout ---
bind=SUPER+CTRL,Return,dwindle_toggle_split_direction

# --- Tile / Master Layout ---
bind=SUPER+CTRL,equal,incnmaster,1
bind=SUPER+CTRL,minus,incnmaster,-1
bind=SUPER+SHIFT,x,switch_proportion_preset
bind=SUPER+CTRL,x,switch_proportion_preset,prev

# --- Switch Layout ---
bind=SUPER+CTRL,Tab,switch_layout
bind=SUPER+CTRL,i,setlayout,tile
bind=SUPER+CTRL,l,setlayout,scroller

# --- Move Window to Tag (SUPER+CTRL + number) ---
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# --- Toggle Tag (SUPER+SHIFT+CTRL + number) ---
bind=SUPER+SHIFT+CTRL,1,toggletag,1
bind=SUPER+SHIFT+CTRL,2,toggletag,2
bind=SUPER+SHIFT+CTRL,3,toggletag,3
bind=SUPER+SHIFT+CTRL,4,toggletag,4
bind=SUPER+SHIFT+CTRL,5,toggletag,5
bind=SUPER+SHIFT+CTRL,6,toggletag,6
bind=SUPER+SHIFT+CTRL,7,toggletag,7
bind=SUPER+SHIFT+CTRL,8,toggletag,8
bind=SUPER+SHIFT+CTRL,9,toggletag,9

# --- Adjacent Tag (CTRL+ALT + arrows) ---
bind=CTRL+ALT,Left,viewtoleft_have_client
bind=CTRL+ALT,Right,viewtoright_have_client

# --- Monitor (SUPER+SHIFT+CTRL + arrows) ---
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Down,tagmon,down
bind=SUPER+ALT+SHIFT,Left,focusmon,left
bind=SUPER+ALT+SHIFT,Right,focusmon,right
bind=SUPER+ALT+SHIFT,Up,focusmon,up
bind=SUPER+ALT+SHIFT,Down,focusmon,down

# --- System ---
bind=SUPER+SHIFT,p,spawn,bash ~/.config/mango/scripts/monitor.sh
bind=SUPER+CTRL,p,spawn,bash ~/.config/mango/scripts/virmon.sh

# --- Volume & Brightness (also on XF86 keys in dms/binds.conf) ---
bind=SUPER,F1,spawn,dms ipc call brightness decrement 5
bind=SUPER,F2,spawn,dms ipc call brightness increment 5
bind=SUPER,F3,spawn,dms ipc call audio decrement 3
bind=SUPER,F4,spawn,dms ipc call audio increment 3

# ============================================================
# Mouse Bindings
# ============================================================
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,set_proportion,0.5
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_left,minimized
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=SUPER+CTRL,btn_middle,togglefullscreen
mousebind=NONE,btn_back,toggleoverview

# ============================================================
# Axis Bindings (touchpad/scroll)
# ============================================================
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER+SHIFT,UP,exchange_client,left
axisbind=SUPER+SHIFT,DOWN,exchange_client,right

# ============================================================
# Gesture Bindings (3/4 finger swipe)
# ============================================================
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# ============================================================
# Feature extras — jump/overcircle/switcher, named scratchpad,
# groups, special workspace, keymode, extra dispatchers
# ============================================================
# Every combo below is free across dms/binds.conf and the rest of
# this file. Lowercase keysyms only. Validate with `mango -p`.

# --- Jump mode (easymotion labels over the overview) ---
bind=ALT,j,togglejump

# --- Overcircle (centered focus column; repeat to cycle) ---
bind=SUPER+ALT,j,overcircle,next
bind=SUPER+ALT+SHIFT,j,overcircle,prev
bind=SUPER+CTRL,j,overcircle,current_next
bind=SUPER+CTRL+SHIFT,j,overcircle,current_prev

# --- Switcher (centered thumbnail panel; release modifier to commit) ---
bind=ALT,grave,switcher,next
bind=ALT+SHIFT,grave,switcher,prev
bind=SUPER+ALT,grave,switcher,all_tag_next
bind=SUPER+ALT+SHIFT,grave,switcher,all_tag_prev
bind=SUPER+CTRL+ALT,grave,switcher,all_next
bind=SUPER+CTRL+ALT+SHIFT,grave,switcher,all_prev

# --- Named scratchpad (kitty + yazi; rule lives in rule.conf) ---
bind=ALT,h,toggle_named_scratchpad,none,kitty-yazi,kitty -T kitty-yazi -e yazi

# --- Groups (SUPER+ALT+SHIFT cluster) ---
bind=SUPER+ALT+SHIFT,h,groupjoin,left
bind=SUPER+ALT+SHIFT,n,groupjoin,down
bind=SUPER+ALT+SHIFT,k,groupjoin,up
bind=SUPER+ALT+SHIFT,l,groupjoin,right
bind=SUPER+ALT+SHIFT,f,groupfocus,next
bind=SUPER+ALT+SHIFT,b,groupfocus,prev
bind=SUPER+ALT+SHIFT,g,groupleave
bind=SUPER+ALT+SHIFT,t,togglegroupbar

# --- Special workspace (tag 0) ---
bind=SUPER+SHIFT+CTRL,0,toggle_special_tag
bind=SUPER+CTRL+ALT,0,tag_special_tag
bind=SUPER+ALT+SHIFT,0,tag_special_silent

# --- Keymode: launch (SUPER+CTRL+SPACE enters, Esc leaves) ---
bind=SUPER+CTRL,space,setkeymode,launch
key_mode=launch
bind=NONE,t,spawn,kitty
bind=NONE,f,spawn,firefox
bind=NONE,e,spawn,kitty -e yazi
bind=NONE,Escape,setkeymode,default
key_mode=default

# --- Extra dispatchers ---
bind=SUPER+CTRL,q,smartkillclient
bind=SUPER+CTRL,c,centerwin
bind=SUPER+CTRL,bracketleft,setmfact,-0.05
bind=SUPER+CTRL,bracketright,setmfact,+0.05
bind=SUPER+CTRL,a,toggle_all_floating
bind=SUPER+CTRL,b,toggle_render_border
bind=SUPER+ALT,o,toggleoverview,1
bind=SUPER+ALT,Return,dwindle_split_horizontal
bind=SUPER+ALT+SHIFT,Return,dwindle_split_vertical
bind=SUPER+CTRL,k,switch_keyboard_layout
bind=SUPER+CTRL,F8,toggle_trackpad_enable
bind=SUPER+CTRL,grave,view_insert,next
bind=SUPER+CTRL+SHIFT,grave,view_insert,prev

# --- Bind-flag examples (uncomment to use) ---
# bindl=SUPER,l,spawn,dms ipc call lock lock              # works while locked
# bindr=SUPER,Super_L,spawn,dms ipc call spotlight toggle # on Super release
# bindp=SUPER,x,spawn,dms ipc call powermenu toggle       # pass key to client too
# bindc=SUPER+ALT,x,resizewin,+10,0                       # allow keybind conflict
# binds=SUPER,h,focusdir,left                            # keysym instead of keycode
# bind=ALT,code:24,killclient                             # bind by keycode

# --- Switch bindings (lid/tablet/keypad; uncomment to use) ---
# switchbind=lid_on,spawn,dms ipc call lock lock
# switchbind=lid_off,spawn,wlr-dpms on
# switchbind=tablet_on,spawn,on-screen-keyboard