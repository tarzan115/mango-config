# DMS default keybinds (MangoWM) — managed by DMS, regenerated by `dms setup`.
# Format: bind=MODS,key,action[,args]
# Put bind descriptions above bind lines; inline # comments break Mango spawn args.
#
# Modifier scheme — SUPER is the master key (Windows/Hyprland/sway style):
#   SUPER                = launchers, focus, navigation, window state
#   SUPER+SHIFT          = move window, quit, secondary actions
#   SUPER+CTRL           = layout & tag management (see bind.conf)
#   ALT / CTRL           = launcher alternates, system
#   SUPER+SHIFT+S / XF86 = screenshots and hardware keys
# Lowercase letters are plain keys; UPPERCASE would mean the shifted key, so
# all letter binds use lowercase to avoid accidental Shift+key combos.

# === Config ===
# Reload config
bind=SUPER,r,reload_config
# Reload config (legacy combo)
bind=SUPER+SHIFT,R,reload_config
# Show config diagnostics
bind=SUPER+CTRL,r,spawn_shell,bash ~/.config/mango/scripts/config_check.sh

# === Application Launchers ===
# Open Terminal
bind=SUPER,Return,spawn,kitty
# Open Terminal
bind=SUPER,t,spawn,kitty
# File Manager (Win+E style)
bind=SUPER,e,spawn,kitty -e yazi
# Application Launcher / Spotlight
bind=SUPER,space,spawn,dms ipc call spotlight toggle
# Spotlight Bar
bind=ALT,space,spawn,dms ipc call spotlight-bar toggle
# Clipboard History (Win+V style)
bind=SUPER,v,spawn,dms ipc call clipboard toggle
# Task Manager
bind=SUPER+SHIFT,Escape,spawn,dms ipc call processlist focusOrToggle
# Settings
bind=SUPER,comma,spawn,dms ipc call settings focusOrToggle
# Notification Center (Win+N style)
bind=SUPER,n,spawn,dms ipc call notifications toggle
# Notepad
bind=SUPER+SHIFT,n,spawn,dms ipc call notepad toggle
# Browse Wallpapers
bind=SUPER,y,spawn,dms ipc call dash toggle wallpaper
# Power Menu
bind=SUPER,x,spawn,dms ipc call powermenu toggle
# Cycle Display Profile (Win+P style)
bind=SUPER,p,spawn,dms ipc call outputs cycleProfile

# === Cheat sheet ===
# Keyboard Shortcuts
bind=SUPER+SHIFT,slash,spawn,dms ipc call keybinds toggle mangowc

# === Security ===
# Lock Screen (Win+L style)
bind=SUPER,l,spawn,dms ipc call lock lock
# Task Manager
bind=CTRL+ALT,Delete,spawn,dms ipc call processlist focusOrToggle

# === Window Rules ===
# Create Window Rule
bind=SUPER+SHIFT,w,spawn,dms ipc call window-rules toggle

# === Screenshots ===
# No Print key on this keyboard, so the cluster is SUPER+SHIFT+S.
# Screenshot: Interactive
bind=SUPER+SHIFT,s,spawn,dms screenshot
# Screenshot: Full Screen
bind=SUPER+SHIFT+CTRL,s,spawn,dms screenshot full
# Screenshot: Window
bind=SUPER+SHIFT+ALT,s,spawn,dms screenshot window

# === Audio Controls ===
bind=none,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 3
bind=none,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 3
bind=none,XF86AudioMute,spawn,dms ipc call audio mute
bind=none,XF86AudioMicMute,spawn,dms ipc call audio micmute
bind=none,XF86AudioPlay,spawn,dms ipc call mpris playPause
bind=none,XF86AudioPause,spawn,dms ipc call mpris playPause
bind=none,XF86AudioPrev,spawn,dms ipc call mpris previous
bind=none,XF86AudioNext,spawn,dms ipc call mpris next

# === Brightness Controls ===
bind=none,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 5
bind=none,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 5

# === Window Management ===
# Close Window
bind=SUPER,q,killclient
# Toggle Fullscreen
bind=SUPER,f,togglefullscreen
# Toggle Fake Fullscreen
bind=SUPER+SHIFT,f,togglefakefullscreen
# Toggle Maximize
bind=SUPER,m,togglemaximizescreen
# Toggle Floating
bind=SUPER+SHIFT,space,togglefloating
# Toggle Global Mode
bind=SUPER,g,toggleglobal
# Toggle Gaps
bind=SUPER+SHIFT,g,togglegaps
# Minimize Window
bind=SUPER,i,minimized
# Restore Minimized Window
bind=SUPER+SHIFT,i,restore_minimized
# Toggle Scratchpad
bind=SUPER,z,toggle_scratchpad
# Swap Master / Zoom
bind=SUPER,s,zoom,
# Toggle Overview
bind=SUPER,o,toggleoverview
# Toggle Overview (Alt+Tab)
bind=ALT,Tab,toggleoverview
# Exit Compositor
bind=SUPER+SHIFT,q,quit

# === Focus Navigation ===
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev
bind=SUPER,BackSpace,focuslast
bind=SUPER,Left,focusdir,left
bind=SUPER,h,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,k,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,j,focusdir,down

# === Window Movement (swap) ===
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,k,exchange_client,up

# === Layout ===
# Increase Gaps
bind=SUPER+SHIFT,equal,incgaps,1
# Decrease Gaps
bind=SUPER+SHIFT,minus,incgaps,-1

# === Tags (1-9): switch view ===
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# === Tags (1-9): move focused window to tag ===
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9