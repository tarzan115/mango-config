# DankMaterialShell — MangoWM configuration (managed by `dms setup`)
# Keybinds, colors, layout, outputs, cursor and window rules are pulled from the
# ./dms fragments below. Add your own binds/rules here; they sit alongside DMS's.

env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

# exec_once runs only at startup. Do NOT use exec= for the shell: mango re-runs
# every exec= on each config reload, and DMS reloads the config, which would
# spawn a new shell on every reload.
#
# DMS is managed by its systemd user service (programs.dms-shell.systemd), which
# is bound to graphical-session.target. Starting that target here (after mango
# has imported its WAYLAND_DISPLAY etc. into the user manager) makes systemd
# bring up DMS.
exec_once=systemctl --user start graphical-session.target

# source_optional: DMS regenerates these fragments (and matugen rewrites
# colors.conf) with the pre-rename keyword names, which mango-nightly rejects.
# Optional keeps a missing fragment from erroring; re-run scripts/migrate_conf.sh
# after `dms setup` or a theme change to re-apply snake_case names.
source_optional=./dms/colors.conf
source_optional=./dms/layout.conf
source_optional=./dms/cursor.conf
source_optional=./dms/outputs.conf
source_optional=./dms/windowrules.conf
source_optional=./dms/binds.conf

# my config
source=./my_config.conf
